name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: colegio-henriques
  SERVICE_NAME: iam-service
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/577474884701/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'deployer@colegio-henriques.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Build and Push Container
        run: |
          DOCKER_TAG="europe-west1-docker.pkg.dev/${{ env.PROJECT_ID }}/ch-registry/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $DOCKER_TAG .
          docker push $DOCKER_TAG

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: europe-west1-docker.pkg.dev/${{ env.PROJECT_ID }}/ch-registry/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated --add-cloudsql-instances colegio-henriques:europe-west1:ch-db-cluster'
          env_vars: |
            DB_HOST=/cloudsql/colegio-henriques:europe-west1:ch-db-cluster
            DB_PORT=5432
            DB_NAME=iam_db
            DB_USER=ch_admin
            DB_PASSWORD=6WY3nKNu3MiaPtI5gI3VfEsxsc8ISUTxTVFlArqLfapyoubk
            JWT_SECRET=super_secret_temporary_key_123
          secrets: |
            GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest
